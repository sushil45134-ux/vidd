name: Anime Episode Sync

# Normal episode sync aur Nxsha/TMDB exact reconciliation har 6 ghante:
# naye aired episodes existing anime collection me add hote hain; Season 0 excluded.
on:
  schedule:
    - cron: "0 */6 * * *"
    # Nxsha/TMDB exact catalogue: every 6 hours, 30 min after normal sync
    - cron: "30 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Kaunsa sync chalana hai"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - nxsha-dry-run
          - nxsha-apply
          - anime-movies-dry-run
          - anime-movies-apply
      limit:
        description: "Nxsha migration collection limit (0 = all)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync new anime episodes
        if: github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch' && inputs.mode == 'normal'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/anime-sync.mjs

      - name: Nxsha anime movies embed (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'anime-movies-dry-run'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/nxsha-anime-movies-embed.mjs

      - name: Nxsha anime movies embed (apply)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'anime-movies-apply'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPLY: "1"
        run: node scripts/nxsha-anime-movies-embed.mjs

      - name: Nxsha exact catalogue dry run
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'nxsha-dry-run'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NXSHA_API_BASE: https://vidd-zeta.vercel.app
          LIMIT: ${{ inputs.limit }}
        run: node scripts/nxsha-reconcile.mjs

      - name: Reconcile all anime with Nxsha catalogue
        id: nxsha_reconcile
        continue-on-error: true
        if: github.event_name == 'schedule' && github.event.schedule == '30 */6 * * *' || github.event_name == 'workflow_dispatch' && inputs.mode == 'nxsha-apply'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Preview deployments are Vercel-auth protected for CI. This API
          # route already exists on production, so reconciliation uses its
          # public Nxsha/TMDB reader while still running branch code.
          NXSHA_API_BASE: https://vidd-zeta.vercel.app
          APPLY: "1"
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          set -o pipefail
          node scripts/nxsha-reconcile.mjs 2>&1 | tee nxsha-reconcile-report.txt

      - name: Save Nxsha catalogue report on branch
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nxsha-reconcile-report.txt
          git commit -m "chore: save Nxsha catalogue repair report [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
