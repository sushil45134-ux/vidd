name: Anime Episode Sync

# Normal episode sync har 6 ghante. Nxsha/TMDB exact reconciliation roz ek baar:
# missing aired episodes add, wrong/legacy season rows replace, Season 0 excluded.
on:
  # One-time targeted repair for Demon Slayer + Jujutsu Kaisen on this preview branch.
  push:
    branches: ["arena/01a0ed8d-vidd"]
    paths:
      - "scripts/nxsha-reconcile.mjs"
      - ".github/workflows/anime-episode-sync.yml"
  schedule:
    - cron: "0 */6 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Kaunsa sync chalana hai"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - nxsha-dry-run
          - nxsha-apply
      limit:
        description: "Nxsha migration collection limit (0 = all)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync new anime episodes
        if: github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch' && inputs.mode == 'normal'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/anime-sync.mjs

      - name: Nxsha exact catalogue dry run
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'nxsha-dry-run'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NXSHA_API_BASE: https://vidd-zeta.vercel.app
          LIMIT: ${{ inputs.limit }}
        run: node scripts/nxsha-reconcile.mjs

      - name: Reconcile all anime with Nxsha catalogue
        id: nxsha_reconcile
        continue-on-error: true
        if: github.event_name == 'push' || github.event_name == 'schedule' && github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch' && inputs.mode == 'nxsha-apply'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Preview deployments are Vercel-auth protected for CI. This API
          # route already exists on production, so reconciliation uses its
          # public Nxsha/TMDB reader while still running branch code.
          NXSHA_API_BASE: https://vidd-zeta.vercel.app
          APPLY: "1"
          LIMIT: ${{ inputs.limit || '0' }}
          TARGET_TMDB_IDS: ${{ github.event_name == 'push' && '85937,95479' || '' }}
          DELETE_OBSOLETE: ${{ github.event_name == 'push' && '1' || '0' }}
        run: |
          set -o pipefail
          node scripts/nxsha-reconcile.mjs 2>&1 | tee nxsha-reconcile-report.txt

      - name: Save Nxsha catalogue report on branch
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nxsha-reconcile-report.txt
          git commit -m "chore: save Nxsha catalogue repair report [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
