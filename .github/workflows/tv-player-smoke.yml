name: TV player smoke

# Runs the real-browser TV player smoke test (scripts/smoke-tv-player.mjs).
# Local sandboxes often cannot download Chromium or its system libraries, and
# the Actions log/blob hosts are not always reachable from them either, so the
# job posts its own output back onto the pull request as a comment.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (full history — the desktop baseline is read via git show)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (never touches the lockfile)
        run: npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps

      - name: Install Playwright + Chromium (test-only, not saved)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund --legacy-peer-deps playwright
          npx playwright install --with-deps chromium

      - name: Typecheck
        run: |
          set -euo pipefail
          npx tsc --noEmit 2>&1 | tee checks.txt
          echo "tsc --noEmit: PASS" | tee -a checks.txt

      - name: Build
        run: |
          set -euo pipefail
          npm run build 2>&1 | tail -n 20 | tee -a checks.txt
          echo "npm run build: PASS" | tee -a checks.txt

      - name: Lint changed files
        run: |
          set -euo pipefail
          npx eslint src/components/VideoPlayer.tsx scripts/smoke-tv-player.mjs 2>&1 | tee -a checks.txt
          echo "eslint (changed files): PASS" | tee -a checks.txt

      - name: Prettier check changed files
        run: |
          set -euo pipefail
          npx prettier --check src/components/VideoPlayer.tsx src/styles.css scripts/smoke-tv-player.mjs 2>&1 | tee -a checks.txt

      - name: Browser smoke test (auto-hide, D-pad wake, focus restore, fallbacks, desktop parity)
        id: smoke
        run: |
          set -euo pipefail
          node scripts/smoke-tv-player.mjs 2>&1 | tee smoke.txt

      - name: Publish results to the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### TV player CI — \`${GITHUB_SHA::7}\`"
            echo
            echo "Job result: **${{ job.status }}** · smoke test step: **${{ steps.smoke.outcome }}**"
            echo
            echo "<details><summary>tsc / build / eslint / prettier</summary>"
            echo
            echo '```'
            cat checks.txt 2>/dev/null || echo "(no checks output)"
            echo '```'
            echo "</details>"
            echo
            echo "<details open><summary>Browser smoke test output</summary>"
            echo
            echo '```'
            tail -n 90 smoke.txt 2>/dev/null || echo "(smoke test did not produce output)"
            echo '```'
            echo "</details>"
          } > results.md
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file results.md
          else
            cat results.md
          fi
