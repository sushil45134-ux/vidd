# Har push par Android APK auto-build karo.
# APK milega: Actions tab → is run → Artifacts → vid-app-debug-apk
name: Build Android APK

on:
  push:
    branches: ["arena/01a089b0-vidd", "arena/01a0869b-vidd", "main"]
    paths: ["android-app/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code nikalo
        uses: actions/checkout@v4

      - name: Java 17 lagao
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK lagao
        uses: android-actions/setup-android@v3

      - name: SDK packages pakka karo (platform + build-tools)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Debug keystore banao (sirf pehli baar)
        working-directory: android-app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "KEYSTORE_NEW=1" >> "$GITHUB_ENV"
            echo "Naya keystore bana — repo me save hoga."
          else
            echo "Keystore pehle se hai — same signature reuse hogi."
          fi

      - name: Gradle download karo
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.7/bin/gradle --version

      - name: APK banao
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK upload karo (download ke liye)
        uses: actions/upload-artifact@v4
        with:
          name: vid-app-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Keystore repo me save karo (sirf pehli baar)
        if: env.KEYSTORE_NEW == '1'
        run: |
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add android-app/debug.keystore
          git commit -m "Add shared debug keystore for wrapper app" || true
          git push origin HEAD:${{ github.ref_name }} || echo "keystore push skipped"

      - name: Fail ho to report upload karo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: android-app/app/build/reports
          if-no-files-found: warn
