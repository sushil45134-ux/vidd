# Native Kotlin app ka APK auto-build.
# APK milega: Actions tab → is run → Artifacts → vid-native-apk
name: Build Native App APK

on:
  push:
    branches: ["arena/01a0869b-vidd", "main"]
    paths: ["android-native/**", ".github/workflows/android-native-apk.yml"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code nikalo
        uses: actions/checkout@v4

      - name: Java 17 lagao
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK lagao
        uses: android-actions/setup-android@v3

      - name: SDK packages pakka karo (platform + build-tools)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle download karo
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.7/bin/gradle --version

      - name: Native APK banao
        working-directory: android-native
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Error annotations banao (debug ke liye)
        if: failure()
        working-directory: android-native
        run: |
          python3 - <<'PYEOF'
          import re
          try:
              log = open('build.log', errors='replace').read()
          except Exception as ex:
              print(f"::error::build.log nahi mila: {ex}")
              raise SystemExit(0)
          errs = []
          for line in log.splitlines():
              s = line.strip()
              low = s.lower()
              if (s.startswith('e: ') or '.kt:' in s or '.java:' in s
                      or 'FAILED' in s or 'Execution failed' in s
                      or 'Caused by:' in s or 'Unresolved reference' in s
                      or 'error:' in low or 'what went wrong' in low):
                  if s and len(s) > 3:
                      errs.append(s[:2500])
          if not errs:
              errs = [l.strip()[:2500] for l in log.splitlines()[-15:] if l.strip()]
          seen, out = set(), []
          for e in errs:
              if e not in seen:
                  seen.add(e)
                  out.append(e)
          for e in out[:10]:
              e = e.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
              print(f"::error::{e}")
          PYEOF

      - name: APK upload karo (download ke liye)
        uses: actions/upload-artifact@v4
        with:
          name: vid-native-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Fail ho to report upload karo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-reports
          path: android-native/app/build/reports
          if-no-files-found: warn
